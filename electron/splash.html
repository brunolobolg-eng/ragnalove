<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>ROguard</title>
    <style>
      /* Splash de abertura (janela transparente, sem moldura): o emblema surge sozinho na área de trabalho. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, sans-serif; }
      .stage { position: relative; width: 360px; height: 360px; animation: pop 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) both, float 3.2s ease-in-out 0.9s infinite; }
      .stage img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55)); }
      /* brilho que passa só por cima do desenho (o próprio emblema é a máscara) */
      .shine { position: absolute; inset: 0; -webkit-mask: url(splash_logo.png) center / contain no-repeat;
        background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.75) 48%, rgba(255, 240, 200, 0.2) 54%, transparent 62%) -200% 0 / 250% 100% no-repeat;
        mix-blend-mode: screen; animation: sweep 2.4s ease-in-out 0.7s infinite; }
      .ring { position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; margin: -165px; border-radius: 50%;
        border: 2px solid rgba(255, 214, 120, 0.85); box-shadow: 0 0 18px rgba(255, 200, 90, 0.6); animation: ring 1.1s ease-out 0.35s both; pointer-events: none; }
      .spark { position: absolute; width: 6px; height: 6px; margin: -3px; background: #fff3c4; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
        animation: twinkle 1.6s ease-in-out infinite; }
      .bar { margin-top: 18px; width: 220px; height: 5px; border-radius: 3px; background: rgba(10, 14, 40, 0.65); box-shadow: 0 0 0 1px rgba(255, 214, 120, 0.55); overflow: hidden; animation: fadein 0.4s 0.6s both; }
      .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f6c64d, #fff1b8); animation: load 2.2s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards; }
      .txt { margin-top: 8px; font-size: 11px; letter-spacing: 2px; color: #fff4d6; text-shadow: 0 1px 3px #000, 0 0 8px rgba(0, 0, 0, 0.8); text-transform: uppercase; animation: fadein 0.4s 0.7s both; }
      .txt b { color: #ffd36a; }
      body.out .stage, body.out .bar, body.out .txt { transition: opacity 0.35s, transform 0.35s; opacity: 0; transform: scale(1.08); }
      @keyframes pop { from { opacity: 0; transform: scale(0.35) rotate(-8deg); } to { opacity: 1; transform: none; } }
      @keyframes float { 50% { transform: translateY(-6px); } }
      @keyframes sweep { 0% { background-position: -200% 0; } 60%, 100% { background-position: 200% 0; } }
      @keyframes ring { from { opacity: 1; transform: scale(0.6); } to { opacity: 0; transform: scale(1.25); } }
      @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1.6) rotate(45deg); } }
      @keyframes load { to { width: 100%; } }
      @keyframes fadein { from { opacity: 0; } }
    </style>
  </head>
  <body>
    <div class="stage">
      <img src="splash_logo.png" alt="" />
      <div class="shine"></div>
      <div class="ring"></div>
    </div>
    <div class="bar"><i></i></div>
    <div class="txt" id="txt"><b>ROguard</b> · verificando arquivos</div>
    <script>
      // estrelinhas em volta do emblema
      const st = document.querySelector('.stage');
      for (let i = 0; i < 9; i++) {
        const s = document.createElement('span');
        s.className = 'spark';
        const a = (i / 9) * Math.PI * 2;
        s.style.left = 180 + Math.cos(a) * (150 + (i % 3) * 14) + 'px';
        s.style.top = 180 + Math.sin(a) * (150 + (i % 2) * 18) + 'px';
        s.style.animationDelay = (0.9 + i * 0.17).toFixed(2) + 's';
        st.appendChild(s);
      }
      const msgs = ['verificando arquivos', 'protegendo a partida', 'carregando o reino'];
      let k = 0;
      setInterval(() => (document.getElementById('txt').innerHTML = '<b>ROguard</b> · ' + msgs[++k % msgs.length]), 900);
    </script>
  </body>
</html>
